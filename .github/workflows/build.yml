name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Match Tick" com.hostanup.matchtick --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Icons and splash
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          G=(15,110,79,255)
          W=(255,255,255,255)
          res='android/app/src/main/res'
          def check(img,pad):
              d=ImageDraw.Draw(img)
              s=img.size[0]
              f=lambda v:s*(pad+(1-2*pad)*v)
              p=[(f(.27),f(.53)),(f(.43),f(.69)),(f(.75),f(.33))]
              w=int(s*(1-2*pad)*0.12)
              d.line(p,fill=W,width=w,joint='curve')
              for x,y in (p[0],p[2]):
                  d.ellipse((x-w/2,y-w/2,x+w/2,y+w/2),fill=W)
          for fl in glob.glob(res+'/mipmap-*/ic_launcher*.png'):
              n=Image.open(fl).size[0]
              if 'foreground' in fl:
                  im=Image.new('RGBA',(n,n),(0,0,0,0)); check(im,0.2)
              else:
                  im=Image.new('RGBA',(n,n),(0,0,0,0)); d=ImageDraw.Draw(im)
                  if 'round' in fl: d.ellipse((0,0,n-1,n-1),fill=G)
                  else: d.rounded_rectangle((0,0,n-1,n-1),radius=n//5,fill=G)
                  check(im,0.15)
              im.save(fl)
          import os
          os.makedirs(res+'/drawable',exist_ok=True)
          st=Image.new('RGBA',(96,96),(0,0,0,0)); check(st,0.12); st.save(res+'/drawable/ic_stat_tick.png')
          for fl in glob.glob(res+'/values/ic_launcher_background.xml'):
              t=open(fl).read().replace('#FFFFFF','#0F6E4F'); open(fl,'w').write(t)
          for fl in glob.glob(res+'/drawable*/splash.png'):
              w,h=Image.open(fl).size
              im=Image.new('RGBA',(w,h),G)
              t=int(min(w,h)*0.3)
              tile=Image.new('RGBA',(t,t),(0,0,0,0)); check(tile,0.05)
              im.paste(tile,((w-t)//2,(h-t)//2),tile)
              im.save(fl)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MatchTick.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Match Tick v${{ github.run_number }}
          files: MatchTick.apk
