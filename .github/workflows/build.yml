          XML
          cat > $R/drawable/notif_bg.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <gradient android:startColor="#0F3A2B" android:endColor="#0D1B22" android:angle="135" />
            <corners android:radius="16dp" />
          </shape>
          XML
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          t=open(p).read()
          perms=''.join('<uses-permission android:name="android.permission.%s"/>\n    '%x for x in ('FOREGROUND_SERVICE','FOREGROUND_SERVICE_SPECIAL_USE','RECEIVE_BOOT_COMPLETED','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','WAKE_LOCK'))
          t=t.replace('<application',perms+'<application',1)
          svc='<service android:name="com.hostanup.matchtick.KeepAliveService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="match reminders"/></service>\n    <receiver android:name="com.hostanup.matchtick.BootReceiver" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>\n    <receiver android:name="com.hostanup.matchtick.AlarmReceiver" android:exported="false"/>\n    <receiver android:name="com.hostanup.matchtick.ActionReceiver" android:exported="false"/>\n    <receiver android:name="com.hostanup.matchtick.MatchWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/match_widget_info"/></receiver>\n  '
          t=t.replace('</application>',svc+'</application>',1)
          open(p,'w').write(t)
          PY
          grep -c KeepAliveService android/app/src/main/AndroidManifest.xml

      - name: Icons and splash
        run: |
          pip install pillow
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          G=(15,110,79,255)
          W=(255,255,255,255)
          res='android/app/src/main/res'
          def check(img,pad):
              d=ImageDraw.Draw(img)
              s=img.size[0]
              f=lambda v:s*(pad+(1-2*pad)*v)
              p=[(f(.27),f(.53)),(f(.43),f(.69)),(f(.75),f(.33))]
              w=int(s*(1-2*pad)*0.12)
              d.line(p,fill=W,width=w,joint='curve')
              for x,y in (p[0],p[2]):
                  d.ellipse((x-w/2,y-w/2,x+w/2,y+w/2),fill=W)
          for fl in glob.glob(res+'/mipmap-*/ic_launcher*.png'):
              n=Image.open(fl).size[0]
              if 'foreground' in fl:
                  im=Image.new('RGBA',(n,n),(0,0,0,0)); check(im,0.2)
              else:
                  im=Image.new('RGBA',(n,n),(0,0,0,0)); d=ImageDraw.Draw(im)
                  if 'round' in fl: d.ellipse((0,0,n-1,n-1),fill=G)
                  else: d.rounded_rectangle((0,0,n-1,n-1),radius=n//5,fill=G)
                  check(im,0.15)
              im.save(fl)
          import os
          os.makedirs(res+'/drawable',exist_ok=True)
          st=Image.new('RGBA',(96,96),(0,0,0,0)); check(st,0.12); st.save(res+'/drawable/ic_stat_tick.png')
          for fl in glob.glob(res+'/values/ic_launcher_background.xml'):
              t=open(fl).read().replace('#FFFFFF','#0F6E4F'); open(fl,'w').write(t)
          for fl in glob.glob(res+'/drawable*/splash.png'):
              w,h=Image.open(fl).size
              im=Image.new('RGBA',(w,h),G)
              t=int(min(w,h)*0.3)
              tile=Image.new('RGBA',(t,t),(0,0,0,0)); check(tile,0.05)
              im.paste(tile,((w-t)//2,(h-t)//2),tile)
              im.save(fl)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MatchTick.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Match Tick v${{ github.run_number }}
          files: MatchTick.apk
