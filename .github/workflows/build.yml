name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Match Tick" com.hostanup.matchtick --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Keep-alive service
        run: |
          D=android/app/src/main/java/com/hostanup/matchtick
          R=android/app/src/main/res
          mkdir -p $D $R/layout $R/xml $R/drawable
          cat > $D/KeepAliveService.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.app.Notification;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          public class KeepAliveService extends Service {
            @Override public IBinder onBind(Intent i) { return null; }
            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              Notification n = Status.build(this);
              if (Build.VERSION.SDK_INT >= 34) {
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
              } else {
                startForeground(1, n);
              }
              Status.widgets(this);
              return START_STICKY;
            }
          }
          JAVA
          cat > $D/BootReceiver.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try {
                AlarmHelper.restore(c);
                Intent s = new Intent(c, KeepAliveService.class);
                if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s); else c.startService(s);
              } catch (Exception e) { }
            }
          }
          JAVA
          cat > $D/KeepAlivePlugin.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          @CapacitorPlugin(name = "KeepAlive")
          public class KeepAlivePlugin extends Plugin {
            @PluginMethod
            public void start(PluginCall call) {
              Context c = getContext();
              try {
                Intent s = new Intent(c, KeepAliveService.class);
                if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(s); else c.startService(s);
              } catch (Exception e) { }
              call.resolve();
            }
            @PluginMethod
            public void battery(PluginCall call) {
              Context c = getContext();
              try {
                PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                if (!pm.isIgnoringBatteryOptimizations(c.getPackageName())) {
                  Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                  i.setData(Uri.parse("package:" + c.getPackageName()));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i);
                }
              } catch (Exception e) { }
              call.resolve();
            }
            @PluginMethod
            public void schedule(PluginCall call) {
              try {
                JSArray arr = call.getArray("items");
                JSArray pend = call.getArray("pend");
                if (pend == null) pend = new JSArray();
                AlarmHelper.apply(getContext(), arr, pend);
                JSObject r = new JSObject();
                r.put("count", arr.length());
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
            @PluginMethod
            public void takeMarks(PluginCall call) {
              try {
                SharedPreferences s = Status.sp(getContext());
                JSONArray a = new JSONArray(s.getString("marks", "[]"));
                JSONArray h = new JSONArray(s.getString("held", "[]"));
                for (int i = 0; i < a.length(); i++) h.put(a.get(i));
                s.edit().putString("marks", "[]").putString("held", h.toString()).apply();
                JSObject r = new JSObject();
                r.put("marks", a);
                call.resolve(r);
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(KeepAlivePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          cat > $D/AlarmHelper.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.HashSet;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class AlarmHelper {
            static PendingIntent pi(Context c, int id, String title, String body, int flags) {
              Intent i = new Intent(c, AlarmReceiver.class);
              i.setAction("mt.alarm." + id);
              i.putExtra("id", id);
              if (title != null) i.putExtra("title", title);
              if (body != null) i.putExtra("body", body);
              return PendingIntent.getBroadcast(c, id, i, flags | PendingIntent.FLAG_IMMUTABLE);
            }
            static void register(Context c, JSONObject o) throws Exception {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent show = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
              am.setAlarmClock(new AlarmManager.AlarmClockInfo(o.getLong("at"), show),
                pi(c, o.getInt("id"), o.getString("title"), o.getString("body"), PendingIntent.FLAG_UPDATE_CURRENT));
            }
            static void cancel(Context c, int id) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              PendingIntent p = pi(c, id, null, null, PendingIntent.FLAG_NO_CREATE);
              if (p != null) { am.cancel(p); p.cancel(); }
            }
            static void apply(Context c, JSONArray items, JSONArray pend) throws Exception {
              SharedPreferences sp = c.getSharedPreferences("mt", Context.MODE_PRIVATE);
              JSONArray old = new JSONArray(sp.getString("alarms", "[]"));
              HashSet<Integer> keep = new HashSet<Integer>();
              for (int i = 0; i < items.length(); i++) keep.add(items.getJSONObject(i).getInt("id"));
              for (int i = 0; i < old.length(); i++) {
                int id = old.getJSONObject(i).getInt("id");
                if (!keep.contains(id)) cancel(c, id);
              }
              for (int i = 0; i < items.length(); i++) register(c, items.getJSONObject(i));
              sp.edit().putString("alarms", items.toString()).putString("pend", pend.toString()).putString("held", "[]").apply();
              Status.update(c);
            }
            static void restore(Context c) {
              try {
                SharedPreferences sp = c.getSharedPreferences("mt", Context.MODE_PRIVATE);
                JSONArray a = new JSONArray(sp.getString("alarms", "[]"));
                long now = System.currentTimeMillis();
                for (int i = 0; i < a.length(); i++) {
                  JSONObject o = a.getJSONObject(i);
                  if (o.getLong("at") > now) register(c, o);
                }
              } catch (Exception e) { }
            }
          }
          JAVA
          cat > $D/AlarmReceiver.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          public class AlarmReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try {
                NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationChannel ch = new NotificationChannel("mt_alarm", "Match reminders", NotificationManager.IMPORTANCE_HIGH);
                  ch.enableVibration(true);
                  nm.createNotificationChannel(ch);
                }
                PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                int icon = c.getResources().getIdentifier("ic_stat_tick", "drawable", c.getPackageName());
                if (icon == 0) icon = android.R.drawable.ic_dialog_info;
                String body = i.getStringExtra("body");
                String title = i.getStringExtra("title");
                Notification n = new NotificationCompat.Builder(c, "mt_alarm")
                  .setSmallIcon(icon)
                  .setContentTitle(title)
                  .setContentText(body)
                  .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                  .setPriority(NotificationCompat.PRIORITY_HIGH)
                  .setDefaults(NotificationCompat.DEFAULT_ALL)
                  .setCategory(NotificationCompat.CATEGORY_ALARM)
                  .setAutoCancel(true)
                  .setContentIntent(open)
                  .build();
                nm.notify(i.getIntExtra("id", 0), n);
              } catch (Exception e) { }
              Status.update(c);
            }
          }
          JAVA
          cat > $D/ActionReceiver.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class ActionReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              try {
                String d = i.getStringExtra("d");
                int m = i.getIntExtra("m", -1);
                int st = i.getIntExtra("st", 1);
                if (d != null && m >= 0) {
                  SharedPreferences s = Status.sp(c);
                  JSONArray a = new JSONArray(s.getString("marks", "[]"));
                  JSONObject o = new JSONObject();
                  o.put("d", d);
                  o.put("m", m);
                  o.put("st", st);
                  a.put(o);
                  s.edit().putString("marks", a.toString()).apply();
                }
              } catch (Exception e) { }
              Status.update(c);
            }
          }
          JAVA
          cat > $D/MatchWidget.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          public class MatchWidget extends AppWidgetProvider {
            @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              Status.widgets(c);
            }
          }
          JAVA
          cat > $D/Status.java <<'JAVA'
          package com.hostanup.matchtick;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.SystemClock;
          import android.widget.RemoteViews;
          import androidx.core.app.NotificationCompat;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class Status {
            static SharedPreferences sp(Context c) { return c.getSharedPreferences("mt", Context.MODE_PRIVATE); }
            static List<String[]> queue(Context c) {
              ArrayList<String[]> q = new ArrayList<String[]>();
              try {
                SharedPreferences s = sp(c);
                long now = System.currentTimeMillis();
                HashSet<String> done = new HashSet<String>();
                String[] keys = new String[] { "marks", "held" };
                for (int k = 0; k < keys.length; k++) {
                  JSONArray a = new JSONArray(s.getString(keys[k], "[]"));
                  for (int i = 0; i < a.length(); i++) {
                    JSONObject o = a.getJSONObject(i);
                    done.add(o.getString("d") + "|" + o.getInt("m"));
                  }
                }
                HashSet<String> seen = new HashSet<String>();
                JSONArray p = new JSONArray(s.getString("pend", "[]"));
                for (int i = 0; i < p.length(); i++) {
                  JSONObject o = p.getJSONObject(i);
                  String key = o.getString("d") + "|" + o.getInt("m");
                  if (!done.contains(key) && seen.add(key)) q.add(new String[] { o.getString("d"), String.valueOf(o.getInt("m")) });
                }
                JSONArray a = new JSONArray(s.getString("alarms", "[]"));
                for (int i = 0; i < a.length(); i++) {
                  JSONObject o = a.getJSONObject(i);
                  if (o.getLong("at") <= now && o.optInt("m", -1) >= 0) {
                    String key = o.getString("d") + "|" + o.getInt("m");
                    if (!done.contains(key) && seen.add(key)) q.add(new String[] { o.getString("d"), String.valueOf(o.getInt("m")) });
                  }
                }
              } catch (Exception e) { }
              Collections.sort(q, new Comparator<String[]>() {
                public int compare(String[] x, String[] y) {
                  int r = x[0].compareTo(y[0]);
                  return r != 0 ? r : Integer.parseInt(x[1]) - Integer.parseInt(y[1]);
                }
              });
              return q;
            }
            static long nextAt(Context c) {
              long best = 0;
              try {
                long now = System.currentTimeMillis();
                JSONArray a = new JSONArray(sp(c).getString("alarms", "[]"));
                for (int i = 0; i < a.length(); i++) {
                  long at = a.getJSONObject(i).getLong("at");
                  if (at > now && (best == 0 || at < best)) best = at;
                }
              } catch (Exception e) { }
              return best;
            }
            static String nextText(long at) {
              if (at <= 0) return "Aaj ke matches khatam";
              return "Agla match " + new SimpleDateFormat("h:mm a", Locale.US).format(new Date(at));
            }
            static String timeText(long at) { return new SimpleDateFormat("h:mm a", Locale.US).format(new Date(at)); }
            static String pendText(int n) { return n == 0 ? "" : n + " tick baaki"; }
            static String slotText(String m) {
              int mm = Integer.parseInt(m);
              int h = mm / 60;
              int h12 = (h + 11) % 12 + 1;
              return h12 + ":" + (mm % 60 < 10 ? "0" : "") + (mm % 60) + " " + (h < 12 ? "AM" : "PM");
            }
            static String slotShort(String m) {
              int mm = Integer.parseInt(m);
              int h12 = (mm / 60 + 11) % 12 + 1;
              return h12 + ":" + (mm % 60 < 10 ? "0" : "") + (mm % 60);
            }
            static String pendLine(List<String[]> q) {
              if (q.isEmpty()) return "";
              StringBuilder sb = new StringBuilder("Tick baaki: ");
              for (int i = 0; i < q.size() && i < 3; i++) {
                if (i > 0) sb.append(", ");
                sb.append(slotText(q.get(i)[1]));
              }
              if (q.size() > 3) sb.append(" +").append(q.size() - 3);
              return sb.toString();
            }
            static PendingIntent act(Context c, String d, String m, int st) {
              Intent i = new Intent(c, ActionReceiver.class);
              i.setAction("mt.act." + st);
              i.putExtra("d", d);
              i.putExtra("m", Integer.parseInt(m));
              i.putExtra("st", st);
              return PendingIntent.getBroadcast(c, st, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }
            static Notification build(Context c) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel("keep2", "Match Tick status", NotificationManager.IMPORTANCE_LOW));
              }
              List<String[]> q = queue(c);
              long at = nextAt(c);
              PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
              int icon = c.getResources().getIdentifier("ic_stat_tick", "drawable", c.getPackageName());
              if (icon == 0) icon = android.R.drawable.ic_dialog_info;
              NotificationCompat.Builder b = new NotificationCompat.Builder(c, "keep2")
                .setContentTitle("Match Tick")
                .setContentText(q.isEmpty() ? nextText(at) : nextText(at) + " · " + pendLine(q))
                .setShowWhen(false)
                .setSmallIcon(icon)
                .setOngoing(true)
                .setOnlyAlertOnce(true)
                .setPriority(NotificationCompat.PRIORITY_LOW)
                .setContentIntent(open);
              RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.notif_status);
              rv.setTextViewText(R.id.nLabel, at > 0 ? "Agla match" : "Aaj");
              rv.setTextViewText(R.id.nTitle, at > 0 ? timeText(at) : "Matches khatam");
              if (at > 0 && Build.VERSION.SDK_INT >= 24) {
                rv.setViewVisibility(R.id.nRight, 0);
                rv.setChronometerCountDown(R.id.nTimer, true);
                rv.setChronometer(R.id.nTimer, SystemClock.elapsedRealtime() + (at - System.currentTimeMillis()), "%s", true);
              } else {
                rv.setViewVisibility(R.id.nRight, 8);
              }
              if (q.isEmpty()) {
                rv.setViewVisibility(R.id.nSub, 8);
              } else {
                rv.setViewVisibility(R.id.nSub, 0);
                rv.setTextViewText(R.id.nSub, pendLine(q));
              }
              b.setColor(0xFF13926A);
              b.setCustomContentView(rv);
              b.setStyle(new NotificationCompat.DecoratedCustomViewStyle());
              if (!q.isEmpty()) {
                String[] f = q.get(0);
                b.addAction(0, "Pura " + slotShort(f[1]), act(c, f[0], f[1], 1));
                b.addAction(0, "Refund " + slotShort(f[1]), act(c, f[0], f[1], 2));
                b.addAction(0, "Cancel " + slotShort(f[1]), act(c, f[0], f[1], 3));
              }
              return b.build();
            }
            static void update(Context c) {
              try {
                NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                nm.notify(1, build(c));
                widgets(c);
              } catch (Exception e) { }
            }
            static void widgets(Context c) {
              try {
                AppWidgetManager am = AppWidgetManager.getInstance(c);
                int[] ids = am.getAppWidgetIds(new ComponentName(c, MatchWidget.class));
                if (ids == null || ids.length == 0) return;
                long at = nextAt(c);
                List<String[]> pq = queue(c);
                PendingIntent open = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                for (int k = 0; k < ids.length; k++) {
                  RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.match_widget);
                  rv.setTextViewText(R.id.wTitle, nextText(at));
                  rv.setTextViewText(R.id.wSub, pendLine(pq));
                  if (at > 0 && Build.VERSION.SDK_INT >= 24) {
                    rv.setViewVisibility(R.id.wTimer, 0);
                    rv.setChronometerCountDown(R.id.wTimer, true);
                    rv.setChronometer(R.id.wTimer, SystemClock.elapsedRealtime() + (at - System.currentTimeMillis()), null, true);
                  } else {
                    rv.setViewVisibility(R.id.wTimer, 8);
                  }
                  rv.setOnClickPendingIntent(R.id.wRoot, open);
                  am.updateAppWidget(ids[k], rv);
                }
              } catch (Exception e) { }
            }
          }
