<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Tick</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#c7cfdb;--ok:#0b6e4f}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:14px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:2px 0 12px}
input[type=date]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.stats{display:grid;grid-template-columns:3fr 2fr;gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:44px;line-height:1;color:var(--ok)}
.stat.small b{font-size:30px;color:var(--ink)}
.stat span{font-size:13px;color:var(--mut)}
.hour{margin-bottom:12px}
.hour h2{font-size:14px;margin:0 0 4px;color:var(--mut);font-weight:600}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button.m{padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
button.m.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.m.on::before{content:"✓ "}
button.m:focus-visible,input:focus-visible,.reset:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.reset{width:100%;padding:12px;margin:6px 0 24px;border-radius:10px;border:1px solid #b42318;background:none;color:#b42318;font-size:14px}
</style>
</head>
<body>
<h1>Match Tick</h1>
<input type="date" id="date" aria-label="Tarikh">
<div class="stats">
  <div class="stat"><b id="day">0</b><span>Is din ke match</span></div>
  <div class="stat small"><b id="week">0</b><span>Is hafte ke</span></div>
</div>
<div id="grid"></div>
<button class="reset" id="reset">Is din ke tick hatao</button>

<script>
const START=10, END=22; // 10 AM se 10 PM (10:00 PM ka match bhi)
let data={};
try{data=JSON.parse(localStorage.getItem('ticks')||'{}')}catch(e){}
const $=id=>document.getElementById(id);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ds=()=>$('date').value||fmt(new Date());
$('date').value=fmt(new Date());
function save(){try{localStorage.setItem('ticks',JSON.stringify(data))}catch(e){}}
function label(h,m){return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function weekTotal(s){
  const d=new Date(s+'T00:00:00'), back=(d.getDay()+6)%7; // hafta Monday se
  let t=0;
  for(let i=0;i<7;i++){
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-back+i);
    t+=(data[fmt(x)]||[]).length;
  }
  return t;
}
function render(){
  const s=ds(), on=data[s]||[];
  let html='', i=0;
  for(let h=START;h<=END;h++){
    html+='<div class="hour"><h2>'+label(h,0).replace(':00','')+'</h2><div class="row">';
    for(let m=0;m<(h===END?1:60);m+=15){
      html+='<button class="m'+(on.includes(i)?' on':'')+'" data-i="'+i+'">'+label(h,m)+'</button>';
      i++;
    }
    html+='</div></div>';
  }
  $('grid').innerHTML=html;
  $('day').textContent=on.length;
  $('week').textContent=weekTotal(s);
}
$('grid').onclick=e=>{
  const b=e.target.closest('button.m'); if(!b) return;
  const s=ds(), i=+b.dataset.i;
  let a=data[s]||[];
  a=a.includes(i)?a.filter(x=>x!==i):a.concat(i);
  data[s]=a; save();
  if(navigator.vibrate) navigator.vibrate(20);
  render();
};
$('date').onchange=render;
$('reset').onclick=()=>{
  if(confirm('Is din ke saare tick hata dein?')){delete data[ds()];save();render();}
};
render();

// Reminder: har match ke time pe notification (sirf APK app mein chalta hai)
async function setupReminders(){
  try{
    const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
    if(!LN) return;
    const p=await LN.requestPermissions();
    if(p.display!=='granted') return;
    await LN.createChannel({id:'match',name:'Match reminder',importance:5,visibility:1,vibration:true});
    const list=[]; let id=1;
    for(let h=START;h<=END;h++){
      for(let m=0;m<(h===END?1:60);m+=15){
        list.push({id:id++,title:'Match time ⏰',body:label(h,m)+' ka match host karo',channelId:'match',schedule:{on:{hour:h,minute:m},allowWhileIdle:true}});
      }
    }
    await LN.schedule({notifications:list});
  }catch(e){}
}
setupReminders();
</script>
</body>
</html>
