<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e4f">
<title>Match Tick</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#0f172a;--mut:#6b7280;--bd:#e8ebf0;--g:#0f6e4f;--gt:#0f6e4f;--gs:#e5f4ed;--lt:#4d7c0f;--ls:#f0f9d8;--rt:#b42318;--rs:#fdecec;--r:#dc2626;--am:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f14;--card:#121a22;--tx:#e8f1f2;--mut:#7d8b99;--bd:#1f2a35;--gt:#3ddc97;--gs:#0f3a2b;--lt:#c6f36b;--ls:#2b3a10;--rt:#ff8a8a;--rs:#3d1519}}
:root[data-theme="dark"]{--bg:#0a0f14;--card:#121a22;--tx:#e8f1f2;--mut:#7d8b99;--bd:#1f2a35;--gt:#3ddc97;--gs:#0f3a2b;--lt:#c6f36b;--ls:#2b3a10;--rt:#ff8a8a;--rs:#3d1519}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:0 16px 150px}
button{font-family:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.dbar button,.wk button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--mut);font-size:26px;line-height:1}
.dbar div,.wk div{font-weight:700;font-size:18px;padding:8px 14px}
.card,.hero{background:var(--card);border:1px solid var(--bd);border-radius:18px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:14px}
.hero small{display:block;font-size:12px;color:var(--mut)}
.hero b{font-size:28px;letter-spacing:-.5px;color:var(--gt)}

.prog{height:6px;border-radius:6px;background:var(--bd);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:6px}
.hr{display:grid;grid-template-columns:44px repeat(4,1fr);gap:8px;align-items:center;margin-bottom:8px}
.hr span{font-size:11px;font-weight:600;color:var(--mut)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px 6px;padding:max(10px,env(safe-area-inset-top)) 16px 4px}
.top .hero{margin-bottom:6px}
.s{position:relative;transition:transform .08s;height:48px;font-size:15px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:500;padding:0}
.s i{font-style:normal;font-size:11px;margin-right:3px}
.s.c{background:var(--gs);border-color:transparent;color:var(--gt);font-weight:700}
.s.f{background:var(--ls);border-color:transparent;color:var(--lt);font-weight:700}
.s.x{background:var(--rs);border-color:transparent;color:var(--rt);font-weight:700}
.s:active{transform:scale(.93)}
.s.m{color:var(--mut)}
.s.m:after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--am)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pl{0%,100%{box-shadow:0 0 0 2px var(--am)}50%{box-shadow:0 0 0 5px rgba(245,158,11,.35)}}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.s.n{animation:pl 1.8s infinite}.s.pop{animation:pop .28s}
#app.fx>*{animation:fd .22s}
.gr{font-size:14px;color:var(--mut);margin:2px 2px 6px}
.hero svg{flex:none}
.hd{padding:max(16px,env(safe-area-inset-top)) 2px 4px}.ttl2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.done{background:linear-gradient(135deg,#0f6e4f,#13926a);color:#fff;border-radius:16px;padding:14px 18px;font-weight:700;margin-bottom:12px;text-align:center}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.conf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.strip{border-left:4px solid var(--g)!important}.strip.sf{border-left-color:#84cc16!important}.strip.sx{border-left-color:var(--r)!important}.strip em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--mut)}
.strip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.strip span{width:44px;font-size:11px;font-weight:600;color:var(--mut)}
.strip b{display:flex;gap:16px;font-size:14px}
.strip u{text-decoration:none;font-weight:700}
u.c{color:var(--gt)}u.f{color:var(--lt)}u.x{color:var(--rt)}
.chart{display:flex;align-items:flex-end;gap:8px;padding:14px 12px 10px;margin-top:14px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.bc i{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--gs)}
.bc i.t{background:var(--g)}
.bc small,.bc span{font-size:10px;color:var(--mut)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#sum{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--bd)}
#sum span{flex:1;text-align:center;font-size:13px;font-weight:700;margin-right:6px;padding:9px 4px;border-radius:20px}
#sum span.p1{background:var(--gs);color:var(--gt)}#sum span.p2{background:var(--ls);color:var(--lt)}#sum span.p3{background:var(--rs);color:var(--rt)}

#sum .undo{width:40px;height:36px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:60px;border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gt);font-weight:700}
nav button.on svg{background:var(--gs);padding:4px 16px;box-sizing:content-box;border-radius:14px;width:22px}
.wk{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.hero.g{display:block;background:linear-gradient(135deg,#0f6e4f,#13926a);border:0;color:#fff;padding:20px}
.hero.g small{color:rgba(255,255,255,.8)}
.hero.g b{display:block;font-size:40px;color:#fff;margin:4px 0}
.day{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd)}
.day:last-child{border:0}
.day.z{opacity:.4}
.day .dn{width:78px}.day .dn b{display:block;font-size:15px}.day .dn small{font-size:12px;color:var(--mut)}
.day .td b{color:var(--gt)}
.day .ch{flex:1;display:flex;gap:10px;font-size:13px;color:var(--mut)}
.ch em{font-style:normal;display:flex;align-items:center;gap:4px}
.ch em:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.day .am{text-align:right}.day .am b{display:block;font-size:15px}.day .am small{font-size:12px;color:var(--mut)}
.ghost{width:100%;padding:13px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;font-weight:600}
.link{width:100%;padding:12px;margin-top:6px;border:0;background:none;color:var(--r);font-size:14px}
.two{display:flex;gap:8px}
.ttl{font-size:24px;font-weight:800;margin:8px 2px 4px}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.card{padding:4px 16px}
.card .ghost,.card textarea{margin-bottom:12px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:15px}
.fr:last-of-type{border:0}
.fr input[type=time]{width:150px;font-size:15px;padding:9px 6px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.fr input[type=number]{width:120px;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);text-align:right}
.in{display:flex;align-items:center;gap:6px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);padding:10px 0 0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--bd);border-radius:28px;transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--g)}
.sw input:checked+span:after{transform:translateX(20px)}
textarea{width:100%;height:76px;margin-top:12px;font-size:12px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}

/* ---- wow layer ---- */
body{background:radial-gradient(circle at 12% -4%,rgba(19,146,106,.22),transparent 42%),radial-gradient(circle at 105% 18%,rgba(60,140,220,.14),transparent 38%),var(--bg);background-attachment:fixed;padding-bottom:185px}
@supports(background:color-mix(in srgb,red,blue)){
.card,.hero,.strip{background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
nav,#sum{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}}
.hero.g{background:linear-gradient(135deg,#0f6e4f,#13926a)}
.hero b{font-size:38px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.hero.g b{font-size:50px}
.hero svg{filter:drop-shadow(0 0 5px rgba(19,146,106,.45))}
.hero svg.fl{animation:flash 1s 2}
@keyframes flash{0%,100%{filter:drop-shadow(0 0 4px rgba(61,220,151,.4))}50%{filter:drop-shadow(0 0 18px rgba(61,220,151,1))}}
nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:30px;border:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.2);padding-bottom:0;overflow:hidden}
nav button{height:58px}
#sum{left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));border-radius:24px;border:1px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px 10px}
@keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.13)}75%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes rip{from{transform:scale(.3);opacity:.35}to{transform:scale(1.7);opacity:0}}
.s.pop{animation:pop .38s cubic-bezier(.3,1.4,.5,1)}
.s.pop:before{content:"";position:absolute;inset:0;border-radius:12px;background:currentColor;animation:rip .55s forwards;pointer-events:none}
.stk{display:inline-block;margin:4px 2px 2px;background:linear-gradient(135deg,#ff9a3c,#ff5e3a);color:#fff;font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:14px}
.tag{display:inline-block;margin-left:8px;background:rgba(255,255,255,.2);padding:2px 10px;border-radius:12px;font-size:12px;color:#fff}

/* ---- focus view ---- */
.seg button{flex:1}
.fwrap{position:relative;height:340px;margin:20px 4px 10px}
.fc{position:absolute;inset:0;border-radius:26px;background:var(--card);border:1px solid var(--bd);box-shadow:0 12px 34px rgba(0,0,0,.12)}
.fc.peek{transform:scale(.94) translateY(14px);opacity:.7}.fc.back{transform:scale(.88) translateY(26px);opacity:.4}
.fc.front{touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;z-index:2;user-select:none;-webkit-user-select:none}
.fc.front.in{animation:cin .32s cubic-bezier(.3,1.3,.5,1)}
@keyframes cin{from{transform:scale(.9) translateY(18px);opacity:.5}to{transform:none;opacity:1}}
.fbig{font-size:68px;font-weight:800;letter-spacing:-2.5px;margin:14px 0 2px;font-variant-numeric:tabular-nums}.fbig small{font-size:24px;letter-spacing:0}
.fhint{color:var(--mut);font-size:14px}
.sw3{display:flex;justify-content:space-between;width:100%;margin-top:28px;font-size:12px;font-weight:700;color:var(--mut)}
.ov{position:absolute;inset:0;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;opacity:0;pointer-events:none}
.row3{display:flex;gap:10px;margin:14px 4px}.row3 button{flex:1;padding:14px;border-radius:16px;border:0;font-size:19px;font-weight:700}
.ftag{display:inline-block;font-size:12px;font-weight:700;padding:5px 14px;border-radius:14px}
.done2{text-align:center;padding:60px 20px;color:var(--mut)}.done2 b{display:block;font-size:26px;color:var(--tx);margin:10px 0 6px}

/* ---- focus wow ---- */
.fwrap{height:420px}
.glow{position:absolute;inset:-6px;border-radius:34px;filter:blur(26px);opacity:0;z-index:0;transition:opacity .12s}
.rg{position:relative;width:230px;height:230px;margin:12px 0 8px}.rg svg{position:absolute;inset:0;width:100%;height:100%}
.rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.rt .fbig{font-size:54px;margin:0}.rt .fbig small{font-size:19px}
.row3{justify-content:center;gap:24px;margin:20px 4px 6px}.row3 button{flex:none;width:68px;height:68px;padding:0;border-radius:50%;font-size:24px;transition:transform .12s}.row3 button:active{transform:scale(.88)}
.tl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 10px 6px}
.dt{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dt.c{background:var(--g)}.dt.f{background:#84cc16}.dt.x{background:var(--r)}
.dt.ms{background:transparent;box-shadow:inset 0 0 0 2px var(--am)}.dt.nw{animation:pl 1.6s infinite;background:var(--am)}
.nx{text-align:center;font-size:13px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
.sw3:not(.wig){opacity:.3}
@keyframes wl{50%{transform:translateX(-7px)}}@keyframes wu{50%{transform:translateY(-7px)}}@keyframes wr{50%{transform:translateX(7px)}}
.wig span:nth-child(1){animation:wl 1.3s infinite}.wig span:nth-child(2){animation:wu 1.3s infinite}.wig span:nth-child(3){animation:wr 1.3s infinite}
.fx2{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);pointer-events:none;z-index:30}
.fx2 b{display:block;font-size:36px;font-weight:800;animation:up .9s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.25)}
@keyframes up{0%{transform:translateY(10px) scale(.6);opacity:0}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{transform:translateY(-80px) scale(1);opacity:0}}
.fx2 i{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fbbf24;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0)}}

/* ---- compact focus ---- */
.fwrap{height:328px;margin:12px 4px 6px}
.fc.front{padding:14px}
.rg{width:186px;height:186px;margin:8px 0 4px}
.rt .fbig{font-size:44px}.rt .fbig small{font-size:16px}
.sw3{margin-top:12px}
.fhint{font-size:13px}
.row3{margin:12px 4px 2px;gap:22px}.row3 button{width:58px;height:58px;font-size:22px}
.tl{margin:12px 10px 2px;gap:5px}.dt{width:9px;height:9px}
.nx{margin-top:6px;font-size:12px}

/* ---- hi-tech layer ---- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.fc.front{touch-action:pan-y;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(from var(--ang),#13926a,#3b82f6,#a855f7,#13926a) border-box;animation:spin 5s linear infinite}
.fc.front.in{animation:cin .32s cubic-bezier(.3,1.3,.5,1),spin 5s linear infinite}
.wig span:nth-child(2){animation:wr 1.3s infinite}
.fbig,.nx{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rb{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--mut)}
#fp.urg{animation:ur 1s infinite}
@keyframes ur{50%{filter:drop-shadow(0 0 7px #ef4444)}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(120,140,160,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,160,.08) 1px,transparent 1px);background-size:30px 30px;-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%)}
nav button.on svg{box-shadow:0 0 16px rgba(19,146,106,.45)}
#boot{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#0f3a2b,#05090d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;animation:bf 1.1s forwards}
#boot b{color:#e8f1f2;letter-spacing:6px;font-size:15px;font-weight:700}
@keyframes bf{0%,70%{opacity:1}100%{opacity:0}}

/* ---- declutter ---- */
body{padding-bottom:165px}
.seg.mini{max-width:210px;margin:max(14px,env(safe-area-inset-top)) auto 8px}
.seg.mini button{padding:7px 10px;font-size:13px}
.top{padding:4px 16px 6px;margin-bottom:8px}
.thin{height:4px;border-radius:4px;background:var(--bd);margin:2px 6px 0;overflow:hidden}
.thin i{display:block;height:100%;background:linear-gradient(90deg,#13926a,#3ddc97);transition:width .4s}
.strip{padding:8px 14px;margin-bottom:5px;border-left-width:3px!important}
.hr{margin-bottom:6px}.s{height:44px}
#sum{padding:5px 8px;bottom:calc(72px + env(safe-area-inset-bottom))}
#sum span{padding:7px 4px;font-size:12px}
#sum .undo{height:32px;width:36px}
nav button{height:52px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:12px;border-radius:14px;background:var(--bg)}.st small{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}.st b{font-size:19px;font-weight:800}

/* ---- report (screenshot) page ---- */
.report{min-height:calc(100vh - 6px)}
.hero.g{padding:16px 20px}.hero.g b{font-size:44px;margin:2px 0}
.day{padding:11px 16px}.day .am{margin-left:auto}
.warn{display:flex;align-items:center;gap:10px;margin:0 4px 10px;background:var(--rs);color:var(--rt);border:1px solid var(--r);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600}.warn button{margin-left:auto;flex:none;border:0;background:var(--r);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sum"></div><div id="toast"></div>
<div id="boot"><svg viewBox="0 0 64 64" width="84" height="84"><circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/><circle cx="32" cy="32" r="27" fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-dasharray="170" stroke-dashoffset="170" transform="rotate(-90 32 32)"><animate attributeName="stroke-dashoffset" from="170" to="0" dur=".8s" fill="freeze"/></circle><path d="M21 33l8 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><b>MATCH TICK</b></div>
<nav>
 <button data-a="v-tick" id="t-tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tick</button>
 <button data-a="v-hisab" id="t-hisab" aria-label="Hisaab"><svg viewBox="0 0 24 24"><text x="12" y="19" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor" stroke="none" style="font-family:system-ui,sans-serif">₹</text></svg></button>
 <button data-a="v-set" id="t-set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<script>

 const cell=(l,v)=>'<div class="st"><small>'+l+'</small><b>'+v+'</b></div>';
 return '<div class="sec">Host Stats</div><div class="card" style="padding:14px"><div style="font-weight:800;font-size:17px">'+g[0]+'</div><div style="color:var(--mut);font-size:13px;margin:2px 0 12px">'+g[1]+'</div><div class="stats">'
 +cell('🔥 Streak',st+' din')+cell('Aaj ka total',money((td.c+td.f)*cfg.pr))+cell('Total match',tm)+cell('Total kamai',money(tm*cfg.pr))+cell('Best din'+(bd?' · '+pd(bd).getDate()+' '+MN[pd(bd).getMonth()]:''),best?best+' match':'—')+cell('Cancel rate',tc?Math.round(tx/tc*100)+'%':'0%')+'</div></div>';
}
function lineChart(vals,dts,today){
 const mx=Math.max(1,...vals),px=i=>22+i*(276/6),py=v=>86-v/mx*56;
 let p='M'+px(0)+','+py(vals[0]);
 for(let i=1;i<7;i++){const cx=(px(i-1)+px(i))/2;p+=' C'+cx+','+py(vals[i-1])+' '+cx+','+py(vals[i])+' '+px(i)+','+py(vals[i])}
 const area=p+' L'+px(6)+',100 L'+px(0)+',100 Z';
 return '<svg viewBox="0 0 320 122" width="100%"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13926a" stop-opacity=".4"/><stop offset="1" stop-color="#13926a" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#ag)"/><path d="'+p+'" fill="none" stroke="#13926a" stroke-width="3" stroke-linecap="round"/>'
 +vals.map((v,i)=>{const t=dts[i]===today;return '<circle cx="'+px(i)+'" cy="'+py(v)+'" r="'+(t?5.5:3.5)+'" fill="'+(t?'#13926a':'var(--card)')+'" stroke="#13926a" stroke-width="2"/>'+(v?'<text x="'+px(i)+'" y="'+(py(v)-10)+'" text-anchor="middle" font-size="9" fill="var(--mut)">'+Math.round(v)+'</text>':'')+'<text x="'+px(i)+'" y="117" text-anchor="middle" font-size="10" fill="var(--mut)">'+DN[pd(dts[i]).getDay()]+'</text>'}).join('')+'</svg>';
}
function hisab(){
 const d=pd(wk),off=(d.getDay()+6)%7,mon=addD(wk,-off),sun=addD(mon,6),today=iso(new Date());
 let tc=0,rows='',tx='',vals=[],dts=[];const pm=addD(mon,-7);let pt=0;for(let i=0;i<7;i++){const c=cnt(db[addD(pm,i)]);pt+=c.c+c.f}
 for(let i=0;i<7;i++){const s=addD(mon,i),dt=pd(s),n=cnt(db[s]),t=n.c+n.f;tc+=t;vals.push(t*cfg.pr);dts.push(s);tx+=dl(s)+': '+t+' match\n';
  rows+='<div class="day'+(t+n.x==0?' z':'')+(s===today?' td':'')+'"><div class="dn"><b>'+DN[dt.getDay()]+'</b><small>'+dt.getDate()+' '+MN[dt.getMonth()]+'</small></div>'
  +'<div class="am"><b>'+money(t*cfg.pr)+'</b><small>'+t+' match</small></div></div>'}
 const rng=pd(mon).getDate()+' '+MN[pd(mon).getMonth()]+' – '+pd(sun).getDate()+' '+MN[pd(sun).getMonth()];
 lastTxt='Match Tick '+rng+'\n'+tx+'Total: '+tc+' match = '+money(tc*cfg.pr);
 const cmp=pt>0?'<div style="text-align:center;font-size:12px;color:var(--mut);padding:0 0 10px">'+(tc>=pt?'▲ ':'▼ ')+Math.abs(Math.round((tc-pt)/pt*100))+'% pichhle hafte se</div>':'';
 $('app').innerHTML='<div class="report"><div class="wk"><button data-a="pw">‹</button><div>'+rng+'</div><button data-a="nw">›</button></div>'
 +'<div class="hero g"><small>Total</small><b>'+money(tc*cfg.pr)+'</b><small>'+tc+' match × '+money(cfg.pr)+'</small></div>'
 +'<div class="card" style="padding:0;margin-top:12px">'+rows+'</div></div>'
 +'<div class="card" style="margin-top:14px;padding:12px 8px 4px">'+lineChart(vals,dts,today)+cmp+'</div>'
 +'<button class="ghost" data-a="share">Hafte ka summary share / copy</button>'+hostStats();
}
const sw=(id,on)=>'<label class="sw"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'><span></span></label>';
function sett(){
 $('app').innerHTML='<div class="ttl">Settings</div>'
 +'<div class="sec">Look</div><div class="card"><div class="fr"><span>Theme</span><div class="seg">'+['auto','light','dark'].map(x=>'<button data-a="th-'+x+'" class="'+((cfg.th||'auto')===x?'on':'')+'">'+x[0].toUpperCase()+x.slice(1)+'</button>').join('')+'</div></div></div>'
 +'<div class="sec">Match</div><div class="card">'
 +'<div class="fr"><span>Ek match ka rate</span><div class="in">₹<input type="number" id="pr" inputmode="decimal" step="any" value="'+cfg.pr+'"></div></div>'
 +'<div class="fr"><span>Pehla match</span><input type="time" id="st" value="'+hhmm(cfg.st)+'"></div>'
 +'<div class="fr"><span>Aakhri match</span><input type="time" id="en" value="'+hhmm(cfg.en)+'"></div></div>'
 +'<div class="sec">Reminder</div><div class="card">'
 +'<div class="fr"><span>Match ke time par</span>'+sw('nr',cfg.nr)+'</div>'
 +'<div class="fr"><span>Tick bhulne par</span>'+sw('nt',cfg.nt)+'</div>'
 +'<div class="fr"><span>Tick reminder, slot ke baad (minute)</span><input type="number" id="dl" inputmode="numeric" value="'+(cfg.dl||15)+'"></div>'
 +'<div class="note" id="si">'+schedInfo+'</div>'
 +'<button class="ghost" data-a="test">Test notification bhejo</button></div>'
 +'<div class="sec">Data</div><div class="card"><textarea id="bk" placeholder="Backup text yahan aayega, ya restore ke liye paste karo"></textarea>'
 +'<div class="two"><button class="ghost" data-a="bkup">Backup + copy</button><button class="ghost" data-a="rest">Restore</button></div>'
 +'<button class="link" data-a="reset">Aaj ke ticks hatao ('+dl(cur)+')</button></div>';
}
function render(){
 ['tick','hisab','set'].forEach(v=>$('t-'+v).className=v===view?'on':'');
 clearInterval(fT);summary();
 $('app').className='fx';setTimeout(()=>{$('app').className=''},300);
 if(view==='tick')tick();else if(view==='hisab')hisab();else sett();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a],[data-i],[data-f]');if(!b)return;
 if(b.dataset.f){fly(+b.dataset.f);return}
 if(b.dataset.i){const m=b.dataset.i;db[cur]=db[cur]||{};hist.push({d:cur,m:m,p:db[cur][m]||0});if(hist.length>50)hist.shift();const n=((db[cur][m]||0)+1)%4;if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate([[8],[14],[10,50,10],[30,60,30]][n]);
  if(n)db[cur][m]=n;else delete db[cur][m];const th=cur+'_'+Math.floor(m/60);Object.keys(open).forEach(k=>{if(k!==th)delete open[k]});save();scrolled=true;lastTap=m;tick();summary();return}
 const a=b.dataset.a;
 if(a.slice(0,2)==='v-'){view=a.slice(2);scrolled=view!=='tick'?false:scrolled}
 else if(a.slice(0,3)==='th-'){cfg.th=a.slice(3);save();applyTheme()}
 else if(a==='hx'){const k=cur+'_'+b.dataset.h;open[k]=!open[k];scrolled=true}
 else if(a.slice(0,3)==='vm-'){cfg.vm=a.slice(3);save();scrolled=false}
 else if(a==='pd'){cur=addD(cur,-1);scrolled=true}
 else if(a==='nd'){cur=addD(cur,1);scrolled=true}
 else if(a==='today'){cur=iso(new Date());scrolled=false}
 else if(a==='pw')wk=addD(wk,-7);
 else if(a==='nw')wk=addD(wk,7);
 else if(a==='reset'){if(confirm('Is din ke saare ticks hata dun?')){delete db[cur];save()}}
 else if(a==='undo'){const u=hist.pop();if(!u){toast('Undo ke liye kuch nahi');return}db[u.d]=db[u.d]||{};if(u.p)db[u.d][u.m]=u.p;else delete db[u.d][u.m];save();cur=u.d;scrolled=true}
 else if(a==='share'){if(typeof navigator!=='undefined'&&navigator.share){navigator.share({text:lastTxt}).catch(()=>copy(lastTxt))}else copy(lastTxt);return}
 else if(a==='fixrem'){if(remWarn==='off'){cfg.nt=true;cfg.nr=true;save()}else sched();return}
 else if(a==='test'){testNote();return}
 else if(a==='bkup'){const t=JSON.stringify({db:db,cfg:cfg});$('bk').value=t;copy(t);return}
 else if(a==='rest'){try{const o=JSON.parse($('bk').value);if(!o.db)throw 0;if(!confirm('Abhi ka data hatake backup wala daal dun?'))return;db=o.db;cfg=Object.assign(cfg,o.cfg||{});save();toast('Restore ho gaya ✓')}catch(e){toast('Backup text sahi nahi hai');return}}
 if(a==='v-hisab')wk=cur;
 render();
});
document.addEventListener('change',e=>{
 if(e.target.id==='pr'){cfg.pr=+e.target.value||0;save()}
 if(e.target.id==='nr'){cfg.nr=e.target.checked;save()}
 if(e.target.id==='rb'){cfg.rb=Math.max(0,Math.min(60,+e.target.value||0));save()}
 if(e.target.id==='nt'){cfg.nt=e.target.checked;save()}
 if(e.target.id==='dl'){cfg.dl=Math.max(1,Math.min(120,+e.target.value||15));save()}
 if(e.target.id==='st'||e.target.id==='en'){
  const a=tom($('st').value),b=tom($('en').value);
  if(!isNaN(a)&&!isNaN(b)&&b>=a){cfg.st=a;cfg.en=b;save()}else{$('st').value=hhmm(cfg.st);$('en').value=hhmm(cfg.en)}
 }
});
setTimeout(()=>{const e=$('boot');if(e&&e.remove)e.remove()},1100);
applyTheme();
render();
sc();
function keep(){try{const k=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.KeepAlive;if(!k)return;k.start({text:liveText()}).catch(()=>{});if(!localStorage.getItem('matchtick.bat')){localStorage.setItem('matchtick.bat','1');k.battery().catch(()=>{})}}catch(e){}}
keep();
let tx0=0,ty0=0;
document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(view!=='tick'||isFocus())return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;if(Math.abs(dx)>90&&Math.abs(dy)<45){cur=addD(cur,dx<0?1:-1);scrolled=true;render()}},{passive:true});
setInterval(keep,300000);
let lastToday=iso(new Date());
function dayRoll(){const t=iso(new Date());if(t===lastToday)return;if(cur===lastToday)cur=t;if(wk===lastToday)wk=t;lastToday=t;scrolled=false;shownK=null;sc();render()}
setInterval(dayRoll,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){dayRoll();sc();keep()}});
</script>
</body>
</html>
