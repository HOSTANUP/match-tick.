<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e4f">
<title>Match Tick</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#0f172a;--mut:#6b7280;--bd:#e8ebf0;--g:#0f6e4f;--gt:#0f6e4f;--gs:#e5f4ed;--lt:#4d7c0f;--ls:#f0f9d8;--rt:#b42318;--rs:#fdecec;--r:#dc2626;--am:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mut:#8b949e;--bd:#262c36;--gt:#4ade80;--gs:#12382b;--lt:#bef264;--ls:#2a3512;--rt:#fca5a5;--rs:#3a1618}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;padding:max(10px,env(safe-area-inset-top)) 16px 150px}
button{font-family:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.dbar button,.wk button{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--mut);font-size:26px;line-height:1}
.dbar div,.wk div{font-weight:700;font-size:18px;padding:8px 14px}
.card,.hero{background:var(--card);border:1px solid var(--bd);border-radius:18px}
.hero{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:14px}
.hero small{display:block;font-size:12px;color:var(--mut)}
.hero b{font-size:28px;letter-spacing:-.5px;color:var(--gt)}
.hero .r{width:42%;text-align:right}
.prog{height:6px;border-radius:6px;background:var(--bd);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:6px}
.hr{display:grid;grid-template-columns:44px repeat(4,1fr);gap:6px;align-items:center;margin-bottom:6px}
.hr span{font-size:11px;font-weight:600;color:var(--mut)}
.s{height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:500;padding:0}
.s i{font-style:normal;font-size:11px;margin-right:3px}
.s.c{background:var(--gs);border-color:transparent;color:var(--gt);font-weight:700}
.s.f{background:var(--ls);border-color:transparent;color:var(--lt);font-weight:700}
.s.x{background:var(--rs);border-color:transparent;color:var(--rt);font-weight:700}
.s.p:not(.c):not(.f):not(.x){opacity:.5}
.s.n{box-shadow:0 0 0 2px var(--am)}
#sum{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;align-items:center;padding:8px 14px;background:var(--card);border-top:1px solid var(--bd)}
#sum span{flex:1;text-align:center;font-size:14px;font-weight:600}
#sum i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#sum .undo{width:40px;height:36px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:60px;border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gt);font-weight:700}
.wk{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.hero.g{display:block;background:linear-gradient(135deg,#0f6e4f,#13926a);border:0;color:#fff;padding:20px}
.hero.g small{color:rgba(255,255,255,.8)}
.hero.g b{display:block;font-size:40px;color:#fff;margin:4px 0}
.day{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bd)}
.day:last-child{border:0}
.day.z{opacity:.4}
.day .dn{width:78px}.day .dn b{display:block;font-size:15px}.day .dn small{font-size:12px;color:var(--mut)}
.day .td b{color:var(--gt)}
.day .ch{flex:1;display:flex;gap:10px;font-size:13px;color:var(--mut)}
.ch em{font-style:normal;display:flex;align-items:center;gap:4px}
.ch em:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.day .am{text-align:right}.day .am b{display:block;font-size:15px}.day .am small{font-size:12px;color:var(--mut)}
.ghost{width:100%;padding:13px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px;font-weight:600}
.link{width:100%;padding:12px;margin-top:6px;border:0;background:none;color:var(--r);font-size:14px}
.two{display:flex;gap:8px}
.ttl{font-size:24px;font-weight:800;margin:8px 2px 4px}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.card{padding:4px 16px}
.card .ghost,.card textarea{margin-bottom:12px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:15px}
.fr:last-of-type{border:0}
.fr input[type=time]{width:150px;font-size:15px;padding:9px 6px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.fr input[type=number]{width:120px;font-size:16px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);text-align:right}
.in{display:flex;align-items:center;gap:6px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);padding:10px 0 0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--bd);border-radius:28px;transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--g)}
.sw input:checked+span:after{transform:translateX(20px)}
textarea{width:100%;height:76px;margin-top:12px;font-size:12px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="sum"></div><div id="toast"></div>
<nav>
 <button data-a="v-tick" id="t-tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Tick</button>
 <button data-a="v-hisab" id="t-hisab"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Hisaab</button>
 <button data-a="v-set" id="t-set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>
<script>
const K='matchtick.v2';
let db={},cfg={pr:3.5,st:600,en:1320,nt:true,dl:15,nr:true,rb:0};
try{db=JSON.parse(localStorage.getItem(K)||'{}');cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(K+'c')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(K+'c',JSON.stringify(cfg))}catch(e){}sc()};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=s=>{const d=pd(s);return (s===iso(new Date())?'Aaj, ':DN[d.getDay()]+', ')+d.getDate()+' '+MN[d.getMonth()]};
const label=m=>{const h=Math.floor(m/60);return ((h+11)%12+1)+':'+String(m%60).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const hlabel=h=>((h+11)%12+1)+' '+(h<12?'AM':'PM');
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const tom=v=>{const p=(v||'').split(':');return p.length==2?(+p[0])*60+(+p[1]):NaN};
const money=n=>'₹'+Math.round(n*100)/100;
const cnt=day=>{const v=Object.values(day||{});return{c:v.filter(x=>x==1).length,f:v.filter(x=>x==2).length,x:v.filter(x=>x==3).length}};
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>{e.style.opacity=0},1800)};
const copy=t=>{try{navigator.clipboard.writeText(t).then(()=>toast('Copy ho gaya ✓'),()=>toast('Copy nahi hua'))}catch(e){toast('Copy nahi hua')}};
const LN=()=>{try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications}catch(e){return null}};
const nid=(ds,m)=>Math.round(Date.UTC(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10))/864e5)*100+m/15;
let scT=0,busy=false,again=false,schedInfo='Abhi check ho raha hai...';
function sc(){clearTimeout(scT);scT=setTimeout(sched,500)}
function setInfo(t){schedInfo=t;const e=$('si');if(e)e.textContent=t}
async function sched(){
 if(busy){again=true;return}
 busy=true;
 try{await doSched()}catch(e){setInfo('Reminder lagne mein dikkat: '+(e&&e.message?e.message:e))}
 busy=false;if(again){again=false;sc()}
}
async function doSched(){
 const ln=LN();if(!ln){setInfo('Reminder sirf APK app mein chalte hain');return}
 let p=await ln.checkPermissions();
 if(p.display!=='granted'){p=await ln.requestPermissions();if(p.display!=='granted'){setInfo('Notification ki permission allow nahi hai');return}}
 try{await ln.createChannel({id:'ticks',name:'Tick reminders',importance:4,vibration:true})}catch(e){}
 const list=[],now=Date.now(),t0=iso(new Date()),dl=cfg.dl||15;
 const mk=(id,title,body,at)=>({id:id,title:title,body:body,channelId:'ticks',smallIcon:'ic_stat_tick',iconColor:'#0F6E4F',schedule:{at:at,allowWhileIdle:true}});
 for(let i=0;i<3;i++){const ds=addD(t0,i),d=pd(ds),day=db[ds]||{};
  for(let m=cfg.st;m<=cfg.en;m+=15){
   if(day[m])continue;
   const at=new Date(d.getTime()+m*60000);
   if(cfg.nr&&at.getTime()>now)list.push(mk(nid(ds,m),'🎮 Match host karo',label(m)+' ka match shuru karne ka time ho gaya',at));
   const at2=new Date(d.getTime()+(m+dl)*60000);
   if(cfg.nt&&at2.getTime()>now)list.push(mk(nid(ds,m)+50000000,'⏰ Tick baaki hai',label(m)+' wale match ka tick nahi kiya. Abhi tick karo.',at2));
  }
 }
 const pend=await ln.getPending();
 if(pend.notifications&&pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
 for(let i=0;i<list.length;i+=40)await ln.schedule({notifications:list.slice(i,i+40)});
 const chk=await ln.getPending(),n=chk.notifications?chk.notifications.length:0;
 list.sort((x,y)=>x.schedule.at-y.schedule.at);
 const nx=list[0]?new Date(list[0].schedule.at):null;
 setInfo(n+' reminder lage hain'+(nx?' · agla: '+label(nx.getHours()*60+nx.getMinutes())+(iso(nx)===t0?'':', '+dl2(nx)):''));
}
const dl2=d=>d.getDate()+' '+MN[d.getMonth()];
async function testNote(){
 const ln=LN();if(!ln){toast('Notification sirf APK app mein chalega');return}
 try{
  let p=await ln.checkPermissions();
  if(p.display!=='granted')p=await ln.requestPermissions();
  if(p.display!=='granted'){toast('Notification ki permission allow karo');return}
  try{await ln.createChannel({id:'ticks',name:'Tick reminders',importance:4,vibration:true})}catch(e){}
  await ln.schedule({notifications:[{id:1,title:'Test ✓',body:'Notification theek chal raha hai',channelId:'ticks',smallIcon:'ic_stat_tick',iconColor:'#0F6E4F',schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});
  toast('5 second mein notification aayega');
 }catch(e){toast('Notification nahi chala')}
}
const cls={1:'c',2:'f',3:'x'};
let hist=[],lastTxt='';let view='tick',cur=iso(new Date()),wk=iso(new Date()),scrolled=false;

function summary(){
 const n=cnt(db[cur]);
 $('sum').style.display=view==='tick'?'flex':'none';
 $('sum').innerHTML='<span><i style="background:var(--g)"></i>'+n.c+' Pure</span><span><i style="background:#84cc16"></i>'+n.f+' Refund</span><span><i style="background:var(--r)"></i>'+n.x+' Cancel</span><button class="undo" data-a="undo" aria-label="Undo">↶</button>';
}
const sl=m=>{const h=Math.floor(m/60);return ((h+11)%12+1)+':'+String(m%60).padStart(2,'0')};
function tick(){
 const day=db[cur]||{},now=new Date(),isT=cur===iso(now),nm=now.getHours()*60+now.getMinutes();
 const n0=cnt(day),tot=Math.floor((cfg.en-cfg.st)/15)+1,dn=n0.c+n0.f+n0.x;
 let h='<div class="dbar"><button data-a="pd">‹</button><div data-a="today">'+dl(cur)+'</div><button data-a="nd">›</button></div>'
 +'<div class="hero"><div><small>Kamai</small><b>'+money((n0.c+n0.f)*cfg.pr)+'</b></div><div class="r"><small>'+dn+' / '+tot+' bhare</small><div class="prog"><i style="width:'+Math.round(dn/tot*100)+'%"></i></div></div></div>';
 for(let hr=Math.floor(cfg.st/60);hr<=Math.floor(cfg.en/60);hr++){
  h+='<div class="hr"><span>'+hlabel(hr)+'</span>';
  for(let q=0;q<4;q++){
   const m=hr*60+q*15;
   if(m<cfg.st||m>cfg.en){h+='<div></div>';continue}
   const st=day[m]||0,past=isT&&m+15<=nm,nowS=isT&&m<=nm&&nm<m+15;
   h+='<button class="s '+(cls[st]||'')+(past?' p':'')+(nowS?' n':'')+'" data-i="'+m+'"'+(nowS?' id="now"':'')+'>'+(st?'<i>'+(st==1?'✓':st==2?'↩':'✕')+'</i>':'')+sl(m)+'</button>';
  }
  h+='</div>';
 }
 $('app').innerHTML=h;
 if(!scrolled){scrolled=true;const e=$('now');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center'})}
}
function hisab(){
 const d=pd(wk),off=(d.getDay()+6)%7,mon=addD(wk,-off),sun=addD(mon,6),today=iso(new Date());
 let tc=0,rows='',tx='';
 for(let i=0;i<7;i++){const s=addD(mon,i),dt=pd(s),n=cnt(db[s]),t=n.c+n.f;tc+=t;tx+=dl(s)+': '+t+' match\n';
  rows+='<div class="day'+(t+n.x==0?' z':'')+(s===today?' td':'')+'"><div class="dn"><b>'+DN[dt.getDay()]+'</b><small>'+dt.getDate()+' '+MN[dt.getMonth()]+'</small></div>'
  +'<div class="ch"><em style="--c:var(--g)">'+n.c+'</em><em style="--c:#84cc16">'+n.f+'</em><em style="--c:var(--r)">'+n.x+'</em></div>'
  +'<div class="am"><b>'+money(t*cfg.pr)+'</b><small>'+t+' match</small></div></div>'}
 const rng=pd(mon).getDate()+' '+MN[pd(mon).getMonth()]+' – '+pd(sun).getDate()+' '+MN[pd(sun).getMonth()];
 lastTxt='Match Tick '+rng+'\n'+tx+'Total: '+tc+' match = '+money(tc*cfg.pr);
 $('app').innerHTML='<div class="wk"><button data-a="pw">‹</button><div>'+rng+'</div><button data-a="nw">›</button></div>'
 +'<div class="hero g"><small>Is hafte ki kamai</small><b>'+money(tc*cfg.pr)+'</b><small>'+tc+' match × '+money(cfg.pr)+'</small></div>'
 +'<div class="card" style="padding:0;margin-top:14px">'+rows+'</div>'
 +'<button class="ghost" data-a="share">Hafte ka summary share / copy</button>';
}
const sw=(id,on)=>'<label class="sw"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'><span></span></label>';
function sett(){
 $('app').innerHTML='<div class="ttl">Settings</div>'
 +'<div class="sec">Match</div><div class="card">'
 +'<div class="fr"><span>Ek match ka rate</span><div class="in">₹<input type="number" id="pr" inputmode="decimal" step="any" value="'+cfg.pr+'"></div></div>'
 +'<div class="fr"><span>Pehla match</span><input type="time" id="st" value="'+hhmm(cfg.st)+'"></div>'
 +'<div class="fr"><span>Aakhri match</span><input type="time" id="en" value="'+hhmm(cfg.en)+'"></div></div>'
 +'<div class="sec">Reminder</div><div class="card">'
 +'<div class="fr"><span>Match ke time par</span>'+sw('nr',cfg.nr)+'</div>'
 +'<div class="fr"><span>Tick bhulne par</span>'+sw('nt',cfg.nt)+'</div>'
 +'<div class="fr"><span>Tick reminder, slot ke baad (minute)</span><input type="number" id="dl" inputmode="numeric" value="'+(cfg.dl||15)+'"></div>'
 +'<div class="note" id="si">'+schedInfo+'</div>'
 +'<button class="ghost" data-a="test">Test notification bhejo</button></div>'
 +'<div class="sec">Data</div><div class="card"><textarea id="bk" placeholder="Backup text yahan aayega, ya restore ke liye paste karo"></textarea>'
 +'<div class="two"><button class="ghost" data-a="bkup">Backup + copy</button><button class="ghost" data-a="rest">Restore</button></div>'
 +'<button class="link" data-a="reset">Aaj ke ticks hatao ('+dl(cur)+')</button></div>';
}
function render(){
 ['tick','hisab','set'].forEach(v=>$('t-'+v).className=v===view?'on':'');
 summary();
 if(view==='tick')tick();else if(view==='hisab')hisab();else sett();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a],[data-i]');if(!b)return;
 if(b.dataset.i){const m=b.dataset.i;db[cur]=db[cur]||{};hist.push({d:cur,m:m,p:db[cur][m]||0});if(hist.length>50)hist.shift();if(typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(12);const n=((db[cur][m]||0)+1)%4;
  if(n)db[cur][m]=n;else delete db[cur][m];save();scrolled=true;tick();summary();return}
 const a=b.dataset.a;
 if(a.slice(0,2)==='v-'){view=a.slice(2);scrolled=view!=='tick'?false:scrolled}
 else if(a==='pd'){cur=addD(cur,-1);scrolled=true}
 else if(a==='nd'){cur=addD(cur,1);scrolled=true}
 else if(a==='today'){cur=iso(new Date());scrolled=false}
 else if(a==='pw')wk=addD(wk,-7);
 else if(a==='nw')wk=addD(wk,7);
 else if(a==='reset'){if(confirm('Is din ke saare ticks hata dun?')){delete db[cur];save()}}
 else if(a==='undo'){const u=hist.pop();if(!u){toast('Undo ke liye kuch nahi');return}db[u.d]=db[u.d]||{};if(u.p)db[u.d][u.m]=u.p;else delete db[u.d][u.m];save();cur=u.d;scrolled=true}
 else if(a==='share'){if(typeof navigator!=='undefined'&&navigator.share){navigator.share({text:lastTxt}).catch(()=>copy(lastTxt))}else copy(lastTxt);return}
 else if(a==='test'){testNote();return}
 else if(a==='bkup'){const t=JSON.stringify({db:db,cfg:cfg});$('bk').value=t;copy(t);return}
 else if(a==='rest'){try{const o=JSON.parse($('bk').value);if(!o.db)throw 0;if(!confirm('Abhi ka data hatake backup wala daal dun?'))return;db=o.db;cfg=Object.assign(cfg,o.cfg||{});save();toast('Restore ho gaya ✓')}catch(e){toast('Backup text sahi nahi hai');return}}
 if(a==='v-hisab')wk=cur;
 render();
});
document.addEventListener('change',e=>{
 if(e.target.id==='pr'){cfg.pr=+e.target.value||0;save()}
 if(e.target.id==='nr'){cfg.nr=e.target.checked;save()}
 if(e.target.id==='rb'){cfg.rb=Math.max(0,Math.min(60,+e.target.value||0));save()}
 if(e.target.id==='nt'){cfg.nt=e.target.checked;save()}
 if(e.target.id==='dl'){cfg.dl=Math.max(1,Math.min(120,+e.target.value||15));save()}
 if(e.target.id==='st'||e.target.id==='en'){
  const a=tom($('st').value),b=tom($('en').value);
  if(!isNaN(a)&&!isNaN(b)&&b>=a){cfg.st=a;cfg.en=b;save()}else{$('st').value=hhmm(cfg.st);$('en').value=hhmm(cfg.en)}
 }
});
render();
sc();
function keep(){try{const k=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.KeepAlive;if(!k)return;k.start().catch(()=>{});if(!localStorage.getItem('matchtick.bat')){localStorage.setItem('matchtick.bat','1');k.battery().catch(()=>{})}}catch(e){}}
keep();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sc();keep()}});
</script>
</body>
</html>
