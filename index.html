<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e4f">
<title>Match Tick</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#d9dfea;--g:#0f6e4f;--l:#a3e635;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a202c;--tx:#f1f5f9;--mut:#94a3b8;--bd:#2b3445}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px 150px}
h2{margin:6px 2px 12px;font-size:20px}
.dbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dbar button,.wk button{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px}
.dbar div{flex:1;text-align:center;font-weight:700;font-size:17px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
h3{margin:16px 2px 6px;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.s{padding:16px 0;font-size:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.s.p{opacity:.55}
.s.n{outline:3px solid #f59e0b;outline-offset:1px}
.s.c{background:var(--g);color:#fff;border-color:var(--g);font-weight:700;opacity:1}
.s.f{background:var(--l);color:#1a2e05;border-color:#84cc16;font-weight:700;opacity:1}
.s.x{background:var(--r);color:#fff;border-color:var(--r);font-weight:700;opacity:1}
#sum{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 14px;background:var(--bg);border-top:1px solid var(--bd)}
#sum div{flex:1;text-align:center;padding:8px;border-radius:12px;color:#fff;font-weight:700;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0 10px;border:0;background:none;color:var(--mut);font-size:13px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.big{font-size:34px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
.row span{font-size:13px}
.wk{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk div{flex:1;text-align:center;font-weight:700}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:17px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.btn{width:100%;padding:13px;margin-top:14px;border-radius:12px;border:1px solid var(--r);background:none;color:var(--r);font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sum"></div>
<nav>
 <button data-a="v-tick" id="t-tick"><b>✓</b>Tick</button>
 <button data-a="v-hisab" id="t-hisab"><b>₹</b>Hisaab</button>
 <button data-a="v-set" id="t-set"><b>⚙</b>Settings</button>
</nav>
<script>
const K='matchtick.v2';
let db={},cfg={pr:3.5,st:600,en:1320};
try{db=JSON.parse(localStorage.getItem(K)||'{}');cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(K+'c')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(K+'c',JSON.stringify(cfg))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dl=s=>{const d=pd(s);return (s===iso(new Date())?'Aaj, ':DN[d.getDay()]+', ')+d.getDate()+' '+MN[d.getMonth()]};
const label=m=>{const h=Math.floor(m/60);return ((h+11)%12+1)+':'+String(m%60).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const hlabel=h=>((h+11)%12+1)+' '+(h<12?'AM':'PM');
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const tom=v=>{const p=(v||'').split(':');return p.length==2?(+p[0])*60+(+p[1]):NaN};
const money=n=>'₹'+Math.round(n*100)/100;
const cnt=day=>{const v=Object.values(day||{});return{c:v.filter(x=>x==1).length,f:v.filter(x=>x==2).length,x:v.filter(x=>x==3).length}};
const cls={1:'c',2:'f',3:'x'};
let view='tick',cur=iso(new Date()),wk=iso(new Date()),scrolled=false;

function summary(){
 const n=cnt(db[cur]);
 $('sum').style.display=view==='tick'?'flex':'none';
 $('sum').innerHTML='<div style="background:var(--g)">✓ '+n.c+' Pure</div><div style="background:#65a30d">↩ '+n.f+' Refund</div><div style="background:var(--r)">✕ '+n.x+' Cancel</div>';
}
function tick(){
 const day=db[cur]||{},now=new Date(),isT=cur===iso(now),nm=now.getHours()*60+now.getMinutes();
 let h='<div class="dbar"><button data-a="pd">‹</button><div data-a="today">'+dl(cur)+'</div><button data-a="nd">›</button></div>',ch=-1;
 for(let m=cfg.st;m<=cfg.en;m+=15){
  const hr=Math.floor(m/60),st=day[m]||0;
  if(hr!=ch){if(ch>=0)h+='</div>';h+='<h3>'+hlabel(hr)+'</h3><div class="grid">';ch=hr}
  const k=(cls[st]||'')+(isT&&m+15<=nm?' p':'')+(isT&&m<=nm&&nm<m+15?' n':'');
  h+='<button class="s '+k+'" data-i="'+m+'" '+(k.indexOf(' n')>-1||k.slice(-1)=='n'?'id="now"':'')+'>'+(st==1?'✓ ':st==2?'↩ ':st==3?'✕ ':'')+label(m)+'</button>';
 }
 if(ch>=0)h+='</div>';
 $('app').innerHTML=h;
 if(!scrolled){scrolled=true;const e=$('now');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center'})}
}
function hisab(){
 const d=pd(wk),off=(d.getDay()+6)%7,mon=addD(wk,-off),sun=addD(mon,6);
 let tc=0,rows='';
 for(let i=0;i<7;i++){const s=addD(mon,i),n=cnt(db[s]),t=n.c+n.f;tc+=t;
  rows+='<div class="row"><div>'+dl(s)+'<br><span style="color:var(--mut)">✓'+n.c+'  ↩'+n.f+'  ✕'+n.x+'</span></div><b>'+t+' match · '+money(t*cfg.pr)+'</b></div>'}
 $('app').innerHTML='<h2>Hisaab</h2><div class="wk"><button data-a="pw">‹</button><div>'+pd(mon).getDate()+' '+MN[pd(mon).getMonth()]+' – '+pd(sun).getDate()+' '+MN[pd(sun).getMonth()]+'</div><button data-a="nw">›</button></div>'
 +'<div class="card"><div style="color:var(--mut);font-size:13px">Is hafte ki kamai</div><div class="big" style="color:var(--g)">'+money(tc*cfg.pr)+'</div><div style="color:var(--mut);font-size:13px">'+tc+' match (green + lime) × '+money(cfg.pr)+'</div></div><div class="card">'+rows+'</div>';
}
function sett(){
 $('app').innerHTML='<h2>Settings</h2><div class="card"><label>Ek match ka rate ₹</label><input type="number" id="pr" inputmode="decimal" step="any" value="'+cfg.pr+'">'
 +'<label>Pehla match</label><input type="time" id="st" value="'+hhmm(cfg.st)+'"><label>Aakhri match</label><input type="time" id="en" value="'+hhmm(cfg.en)+'">'
 +'<button class="btn" data-a="reset">Is din ke saare ticks hatao ('+dl(cur)+')</button></div>';
}
function render(){
 ['tick','hisab','set'].forEach(v=>$('t-'+v).className=v===view?'on':'');
 summary();
 if(view==='tick')tick();else if(view==='hisab')hisab();else sett();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a],[data-i]');if(!b)return;
 if(b.dataset.i){const m=b.dataset.i;db[cur]=db[cur]||{};const n=((db[cur][m]||0)+1)%4;
  if(n)db[cur][m]=n;else delete db[cur][m];save();scrolled=true;tick();summary();return}
 const a=b.dataset.a;
 if(a.slice(0,2)==='v-'){view=a.slice(2);scrolled=view!=='tick'?false:scrolled}
 else if(a==='pd'){cur=addD(cur,-1);scrolled=true}
 else if(a==='nd'){cur=addD(cur,1);scrolled=true}
 else if(a==='today'){cur=iso(new Date());scrolled=false}
 else if(a==='pw')wk=addD(wk,-7);
 else if(a==='nw')wk=addD(wk,7);
 else if(a==='reset'){if(confirm('Is din ke saare ticks hata dun?')){delete db[cur];save()}}
 if(a==='v-hisab')wk=cur;
 render();
});
document.addEventListener('change',e=>{
 if(e.target.id==='pr'){cfg.pr=+e.target.value||0;save()}
 if(e.target.id==='st'||e.target.id==='en'){
  const a=tom($('st').value),b=tom($('en').value);
  if(!isNaN(a)&&!isNaN(b)&&b>=a){cfg.st=a;cfg.en=b;save()}else{$('st').value=hhmm(cfg.st);$('en').value=hhmm(cfg.en)}
 }
});
render();
</script>
</body>
</html>
