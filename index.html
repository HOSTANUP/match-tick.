<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6e4f">
<title>Match Tick</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#14213d;--mut:#5b6678;--bd:#d5dbe6;--g:#0f6e4f;--l:#a3e635;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a202c;--tx:#f1f5f9;--mut:#94a3b8;--bd:#2b3445}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:40px}
h1{font-size:22px;margin:0 0 12px}
input{width:100%;font-size:18px;padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
.row{display:flex;gap:10px;margin:12px 0}
.box{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.box b{display:block;font-size:30px}
.box span{font-size:12px;color:var(--mut)}
.g{color:var(--g)}.l{color:#65a30d}.r{color:var(--r)}
.legend{font-size:13px;color:var(--mut);margin:8px 2px}
h3{margin:16px 2px 6px;font-size:15px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button.s{padding:16px 0;font-size:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.s.c{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
button.s.f{background:var(--l);color:#1a2e05;border-color:#84cc16;font-weight:700}
button.s.x{background:var(--r);color:#fff;border-color:var(--r);font-weight:700}
.set{display:flex;gap:8px;margin-top:8px}.set label{flex:1;font-size:12px;color:var(--mut)}
.set input{font-size:16px;padding:10px}
.bar{display:flex;gap:8px;margin-top:10px}
.bar button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px}
</style>
</head>
<body>
<h1>Match Tick</h1>
<input type="date" id="d">
<div class="legend">Tap karo: ✓ Pura (green) → 1 banda aaya/refund (lime) → Cancel (red) → khali</div>
<div class="row">
 <div class="box"><b class="g" id="c">0</b><span>Pura hue</span></div>
 <div class="box"><b class="l" id="f">0</b><span>Refund</span></div>
 <div class="box"><b class="r" id="x">0</b><span>Cancel</span></div>
</div>
<div class="row">
 <div class="box"><b id="wc">0</b><span>Is hafte ke pura match</span></div>
 <div class="box"><b id="we">₹0</b><span>Is hafte ki kamai</span></div>
</div>
<div class="set">
 <label>Pura match ₹<input type="number" id="pr" inputmode="decimal"></label>
 <label>Refund match ₹<input type="number" id="rr" inputmode="decimal"></label>
</div>
<div id="list"></div>
<div class="bar"><button id="clr">Aaj ka reset</button></div>
<script>
const K='matchtick.v1';
let db={},cfg={pr:0,rr:0};
try{db=JSON.parse(localStorage.getItem(K)||'{}');cfg=JSON.parse(localStorage.getItem(K+'c')||'{"pr":0,"rr":0}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(K+'c',JSON.stringify(cfg))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
$('d').value=iso(new Date());
$('pr').value=cfg.pr||'';$('rr').value=cfg.rr||'';
const label=i=>{const m=10*60+i*15,h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const hlabel=h=>((h+11)%12+1)+' '+(h<12?'AM':'PM');
const cls={1:'c',2:'f',3:'x'};
function render(){
 const day=db[$('d').value]||{};let h='';
 for(let hr=0;hr<12;hr++){
  h+='<h3>'+hlabel(10+hr)+'</h3><div class="grid">';
  for(let q=0;q<4;q++){const i=hr*4+q,s=day[i]||0;
   h+='<button class="s '+(cls[s]||'')+'" data-i="'+i+'">'+(s==1?'✓ ':s==2?'↩ ':s==3?'✕ ':'')+label(i)+'</button>';}
  h+='</div>';
 }
 $('list').innerHTML=h;
 const v=Object.values(day);
 $('c').textContent=v.filter(x=>x==1).length;
 $('f').textContent=v.filter(x=>x==2).length;
 $('x').textContent=v.filter(x=>x==3).length;
 const dt=new Date($('d').value+'T00:00:00'),off=(dt.getDay()+6)%7;
 let wc=0,wf=0;
 for(let k=0;k<7;k++){const t=new Date(dt);t.setDate(dt.getDate()-off+k);
  const dd=db[iso(t)]||{};Object.values(dd).forEach(x=>{if(x==1)wc++;if(x==2)wf++})}
 $('wc').textContent=wc;
 $('we').textContent='₹'+(wc*cfg.pr+wf*cfg.rr);
}
$('list').addEventListener('click',e=>{
 const b=e.target.closest('button.s');if(!b)return;
 const k=$('d').value,i=b.dataset.i;db[k]=db[k]||{};
 const n=((db[k][i]||0)+1)%4;
 if(n)db[k][i]=n;else delete db[k][i];
 save();render();
});
$('d').addEventListener('change',render);
$('pr').addEventListener('input',()=>{cfg.pr=+$('pr').value||0;save();render()});
$('rr').addEventListener('input',()=>{cfg.rr=+$('rr').value||0;save();render()});
$('clr').addEventListener('click',()=>{if(confirm('Aaj ke saare ticks hata dun?')){delete db[$('d').value];save();render()}});
render();
</script>
</body>
</html>
